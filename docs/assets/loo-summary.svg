<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="345" viewBox="0 0 1020 345" role="img" aria-labelledby="title desc"><title id="title">Mean held-out error by method</title><desc id="desc">Bars are generated directly from checked-in leave-one-out result CSV files.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#17211c}.label{font-size:14px}.small{font-size:12px;fill:#5d6962}.value{font-size:12px;font-weight:650}.axis{stroke:#cbd5cf;stroke-width:1}</style><text x="205" y="30" class="label" font-weight="700">Mean RMSE</text><line x1="205" y1="45" x2="505" y2="45" class="axis"/><line x1="205" y1="42" x2="205" y2="48" class="axis"/><text x="205" y="62" text-anchor="middle" class="small">0.00</text><line x1="265" y1="42" x2="265" y2="48" class="axis"/><text x="265" y="62" text-anchor="middle" class="small">0.05</text><line x1="325" y1="42" x2="325" y2="48" class="axis"/><text x="325" y="62" text-anchor="middle" class="small">0.10</text><line x1="385" y1="42" x2="385" y2="48" class="axis"/><text x="385" y="62" text-anchor="middle" class="small">0.15</text><line x1="445" y1="42" x2="445" y2="48" class="axis"/><text x="445" y="62" text-anchor="middle" class="small">0.20</text><line x1="505" y1="42" x2="505" y2="48" class="axis"/><text x="505" y="62" text-anchor="middle" class="small">0.25</text><text x="195" y="99" text-anchor="end" class="label">Direct one-shot</text><rect x="205" y="85" width="72.2" height="20" rx="3" fill="#d97706"/><text x="283.2" y="100" class="value">0.060</text><text x="195" y="147" text-anchor="end" class="label">Structured two-step</text><rect x="205" y="133" width="125.0" height="20" rx="3" fill="#8b5cf6"/><text x="336.0" y="148" class="value">0.104</text><text x="195" y="195" text-anchor="end" class="label">Marginally weighted twins</text><rect x="205" y="181" width="157.5" height="20" rx="3" fill="#2f7d57"/><text x="368.5" y="196" class="value">0.131</text><text x="195" y="243" text-anchor="end" class="label">Un